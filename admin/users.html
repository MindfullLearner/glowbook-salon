<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients · GlowBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Our clients</h1>
                <p class="page-subtitle">Everyone who has signed up to book with the salon.</p>
            </div>
        </div>

        <div class="panel">
            <form id="filter-form" class="filter-bar">
                <input type="text" id="search" placeholder="Search by name or email...">
                <button type="submit" class="btn-secondary">Search</button>
            </form>

            <div id="users-container"><p class="loading-state">Loading...</p></div>
        </div>
    </main>
</div>

<script>window.API_BASE = '../api';</script>
<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin-users.js"></script>
</body>
</html>
