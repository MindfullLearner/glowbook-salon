<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Services · GlowBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Services</h1>
                <p class="page-subtitle">Add, edit, or remove the services clients can book.</p>
            </div>
        </div>

        <div id="alert-box"></div>

        <div class="two-col">
            <div class="panel">
                <div class="panel-header"><h2 id="form-title">Add new service</h2></div>
                <form id="service-form">
                    <input type="hidden" id="service_id" value="">

                    <label for="name">Service name</label>
                    <input type="text" id="name" required>

                    <label for="description">Description</label>
                    <textarea id="description" rows="3"></textarea>

                    <label for="duration_minutes">Duration (minutes)</label>
                    <input type="number" id="duration_minutes" min="5" value="30" required>

                    <label for="price">Price (Rs.)</label>
                    <input type="number" id="price" min="0" step="0.01" value="0" required>

                    <label class="checkbox-label">
                        <input type="checkbox" id="is_active" checked>
                        Active (visible to clients)
                    </label>

                    <div>
                        <button type="submit" class="btn-primary" id="submit-btn">Add service</button>
                        <button type="button" class="btn-secondary" id="cancel-edit-btn" style="display:none;">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-header"><h2>All services</h2></div>
                <div id="services-container"><p class="loading-state">Loading...</p></div>
            </div>
        </div>
    </main>
</div>

<script>window.API_BASE = '../api';</script>
<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin-services.js"></script>
</body>
</html>
