<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · GlowBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">Glow<span>Book</span></div>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to manage your appointments.</p>

        <div id="alert-box"></div>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn-primary">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
        <p class="auth-hint">Admin demo login: admin@example.com / Admin@123</p>
    </div>
</div>

<script>window.API_BASE = 'api';</script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
