<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account · GlowBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">Glow<span>Book</span></div>
        <h1>Create your account</h1>
        <p class="auth-subtitle">Book appointments in a few clicks.</p>

        <div id="alert-box"></div>

        <form id="register-form" novalidate>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone (optional)</label>
            <input type="text" id="phone" name="phone">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <small class="hint">At least 8 characters, one uppercase letter, one number.</small>

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit" class="btn-primary">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
</div>

<script>window.API_BASE = 'api';</script>
<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
